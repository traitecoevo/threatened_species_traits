traits:
  description: >
    Trait proposals arising from the species-profile-traits extraction workflow
    (see .claude/skills/species-profile-traits/SKILL.md). Each of these started
    as a `proposed_new_trait` in one or more species' *_apd.csv crosswalk files
    and has since been reviewed and accepted (match_confidence upgraded to
    `new_trait` in those files). Structured to mirror config/traits.yml so it
    can be merged there directly. Values listed under each trait are the ones
    actually used so far in data_from_profiles/*_apd.csv - not necessarily
    exhaustive; add a new allowed value here whenever a species needs one this
    file doesn't yet have, keeping this file and the crosswalk rows in sync.
  type: list
  elements:
    plant_response_to_grazing:
      label: Plant response to grazing
      description: >
        A species' response to grazing/browsing pressure. Distinguishes
        tolerance/intolerance by broad grazer category - introduced/feral
        ungulates (sheep, cattle, goats, deer, pigs: hoofed, typically
        heavier-impact grazers/browsers with no evolutionary history with
        Australian flora) versus native mammals (e.g. macropods), since a
        species' response genuinely differs between the two in several
        source documents (tolerant of light native browsing, intolerant of
        introduced-ungulate impact). The plain grazing_tolerant/
        grazing_intolerant values (no grazer-type qualifier) are for a
        source describing a general grazing relationship without
        distinguishing which kind of grazer is involved. Rabbits were
        deliberately not covered by any value here from 2026-08-25 until
        2026-09-02, when a rabbit-specific intolerance value was added at
        the maintainer's request after this project had been ignoring
        rabbit-specific grazing impacts under that earlier decision - a
        rabbit-tolerance counterpart value has not yet been requested/added.
        Other non-ungulate feral herbivores (besides rabbits) are still not
        covered by any value here - leave those unscored rather than force
        them under the ungulate values.
      type: categorical
      allowed_values_levels:
        grazing_tolerant: Not adversely affected by grazing, or benefits from it (e.g. via reduced competition) - grazer type not distinguished.
        grazing_intolerant: Adversely affected by grazing - grazer type not distinguished.
        grazing_tolerant_feral_ungulates: Not adversely affected by grazing/browsing from introduced, hoofed grazers (sheep, cattle, goats, deer, pigs, etc.).
        grazing_intolerant_feral_ungulates: Adversely affected by grazing/browsing from introduced, hoofed grazers (sheep, cattle, goats, deer, pigs, etc.).
        grazing_tolerant_native_mammals: Not adversely affected by grazing/browsing from native mammals (e.g. macropods).
        grazing_intolerant_native_mammals: Adversely affected by grazing/browsing from native mammals (e.g. macropods).
        intolerant_to_grazing_by_rabbits: Adversely affected by grazing/browsing from rabbits (Oryctolagus cuniculus) specifically.
      status: accepted 2026-08-25; intolerant_to_grazing_by_rabbits value added 2026-09-02
      used_in: [eriocaulon_carsonii, acacia_pinguifolia, acacia_imitans, acacia_lanigera_var_gracilipes, colobanthus_curtisiae, dichanthium_queenslandicum, dichanthium_setosum, zieria_odorifera_subsp_copelandii, nematolepis_rhytidophylla, boronia_grimshawii, kardomia_silvestris, prostanthera_tallowa, coleus_insularis, diuris_ochroma, eleocharis_keigheryi, eleocharis_obicis, eucalyptus_aggregata, eucalyptus_alligatrix_miscella, eucalyptus_argutifolia, eucalyptus_beardiana, eucalyptus_crispata, eucalyptus_glaucina, eucalyptus_rhodantha, eucalyptus_strzeleckii, grevillea_celata, grevillea_elongata, grevillea_kennedyana, grevillea_raybrownii, hakea_aculeata, hakea_fraseri, hakea_maconochieana, helichrysum_calvertianum, hibbertia_marginata]
    leaf_cross_section_shape:
      label: Leaf cross-section shape
      description: >
        The shape of a leaf in transverse (cross) section - distinct from
        leaf_shape, which records the leaf's 2D outline as seen face-on, and
        from leaf_lamina_division, which records how deeply/how a leaf is
        divided or lobed.
      type: categorical
      allowed_values_levels:
        keeled: A leaf with a ridge (keel) along the midline in cross-section, like the keel of a boat.
        conduplicate: A leaf folded lengthwise along the midrib, V-shaped in cross-section.
        terete: A leaf circular in cross-section.
        subterete: A leaf almost circular in cross-section.
        flat: A leaf flat (not folded, ridged, or curved) in cross-section.
        concave_convex: A leaf slightly concave on the upper (adaxial) surface and slightly convex on the lower (abaxial) surface in cross-section.
      status: accepted 2026-08-24
      used_in: [darwinia_carnea, hibbertia_abyssa, styphelia_capillaris, wurmbea_calcicola, anigozanthos_viridis_terraspectans, conostylis_dielsii_teres, acacia_lauta, conostylis_drummondii, conostylis_lepidospermoides, conostylis_setigera_subsp_dasys, corybas_sulcatus, cyperus_cephalotes, darwinia_masonii, darwinia_sp_carnamah, darwinia_wittwerorum, daviesia_dielsii, dendrobium_carronii, dendrobium_nindii, deyeuxia_appressa, deyeuxia_drummondii, conospermum_quadripetalum, homoranthus_croftianus, leptospermum_crassifolium, olearia_suffruticosa, persoonia_flexifolia, pherosphaera_fitzgeraldii, deyeuxia_talariata, boronia_deanei_acutifolia, boronia_deanei_deanei, drummondita_longifolia, hakea_fraseri]
    stem_cross_section_shape:
      label: Stem cross-section shape
      description: >
        The shape of a stem, branch, or branchlet in transverse (cross)
        section - the stem-axis parallel to the existing project trait
        leaf_cross_section_shape, and reused with a context note (e.g.
        context="inflorescence axis", context="filament") for other
        elongated axis-like structures a source describes the same way.
        Distinct from stem_cross_sectional_area, a dimension trait, not a
        shape descriptor.
      type: categorical
      allowed_values_levels:
        terete: A stem circular in cross-section.
        winged: A stem with flattened, wing-like extensions running along its length.
        angular: A stem with distinct angles or ridges in cross-section, of unspecified number.
        quadrangular: A stem square or four-angled in cross-section.
      status: accepted 2026-08-25
      used_in: [acacia_anomala, acacia_curranii, daviesia_bursarioides, daviesia_discolor, eucalyptus_insularis, grevillea_rara, pityrodia_axillaris, styphelia_capillaris, acacia_lauta, babingtonia_tozerensis, canthium_costatum, choretrum_spicatum_subsp_spicatum, ctenopteris_blechnoides, cyperus_cephalotes, cyperus_semifertilis, dendrobium_antennatum, dendrobium_bigibbum, dendrobium_mirbelianum, dendrobium_nindii, dichanthium_queenslandicum, dodonaea_rupicola, conospermum_quadripetalum, eucalyptus_boliviana, persoonia_flexifolia, pittosporum_kororoense, eleocharis_obicis, eucalyptus_beardiana, eucalyptus_langleyi, eucalyptus_robertsonii_hemisphaerica, eucalyptus_steedmanii]
    fruit_shape:
      label: Fruit shape
      description: >
        The 3-dimensional shape of a fruit. Allowed values are identical to
        the existing APD trait seed_shape, applied here to the fruit as a
        whole (pod, capsule, drupe, etc.) rather than the seed inside it -
        the two structures are routinely described with the same shape
        vocabulary in source text, and no dedicated fruit-shape trait exists
        in the released APD.
      type: categorical
      allowed_values_levels:
        comma-shaped: A fruit displaying a single arc of curvature, such that it bilaterally symmetrical. (Synonyms, comma-shaped, falcate, sickle-shaped scimitar-shaped)
        conical: Cone-shaped, with a broad flat base and narrow apex; turbinate refers to the inverse shape.
        cuneate: A 3-dimensional shape that is wedge-shaped or boat-shaped.
        cylindrical: A cylinder, a shape with a flat top and bottom that are circular or elliptical in outline and are linked by a curved surface.
        discoid: A subset of cylinder, a shape with a flat, circular or elliptical top and bottom, linked by a curved surface, where the length of the curved surface is much shorter than the cross-section of the flat surfaces.
        ellipsoid: A 3-dimensional shape that is elliptic in long section and circular in cross section; length-to-width ratio between 2:1 and 3:2.
        ellipsoid_flattened: A 3-dimensional shape that is elliptic in long section and laterally compressed/flattened such that it is non-circular in cross section; length-to-width ratio between 2:1 and 3:2.
        fusiform: Spindle-shaped; a 3-dimensional shape that is narrowly ellipsoid, circular in cross-section and tapering sharply toward both ends.
        globoid: A 3-dimensional shape that is circular in both long section and cross section.
        globoid_flattened: A 3-dimensional shape that is circular in both long section and somewhat flattened such that it is non-circular in cross section.
        hemispheric: Half a sphere or globe, with a flat base, domed top, and circular in cross-section.
        hemispheric_flattened: A 3-dimensional shape that is a laterally compressed/flattened half-sphere or globe; shape has a flat base, a domed top, and is elliptical in cross-section.
        lenticular: Shaped like a biconvex lens and circular in cross section; shaped like a lentil.
        orbicular: A poorly defined term that remains in AusTraits only as a placeholder; it appears to be used as both globoid (spherical) and lenticular by different authors.
        ovoid: A 3-dimensional shape that is egg-shaped in long section and circular in cross section, including variants such as pyriform (pear-shaped) and obovoid (inversely egg-shaped).
        ovoid_elongated: A 3-dimensional shape that is egg-shaped in long section and circular in cross section, where the length dimension is much longer than the width/height dimensions - includes club-shaped (clavate/obclavate) and tear-shaped (lachrimiform) variants.
        ovoid_flattened: A 3-dimensional shape that is egg-shaped in long section and laterally compressed/flattened such that it is non-circular in cross section.
        polyhedral: A 3-dimensional shape with distinct, fairly flat faces and edges; includes prisms and tetrahedral shapes.
        polyhedral_elongated: A 3-dimensional shape with distinct, fairly flat faces and edges, where the length dimension is much longer than the width/height dimensions; includes elongate prisms and elongate tetrahedral shapes.
        polyhedral_inflated: A 3-dimensional shape with distinct faces and edges but the faces tend to bulge outwards.
        reniform: Having a cross-section that is roughly circular with a notch; strictly a kidney-shape but the definition applied here includes heart-shaped and other notched shapes.
        winged: A fruit with wings.
        sectoroid: Shaped like an orange segment or wedge of a sphere.
        sinusoidal: A shape with two arcs of curvature or a single arc, such that it lacks an axis of symmetry.
        oblique: An asymmetric shape, lopsided along its main axis rather than radially or bilaterally symmetric. Proposed 2026-09-03 (Grevillea elongata) for a fruit described only as "obliquely-shaped" with no more specific comparison given.
      status: accepted 2026-08-25
      used_in: [eucalyptus_insularis, cossinia_australiana, eucalyptus_conglomerata, cupaniopsis_shirleyana, daviesia_euphorbioides, gardenia_actinocarpa, eucalyptus_synandra, acacia_grandifolia, acacia_ammophila, acacia_curranii, eucalyptus_ceracea, eucalyptus_stenostoma, sarcochilus_hartmannii, atriplex_infrequens, acacia_lauta, daviesia_bursarioides, dryandra_montana, eremophila_viscida, euphrasia_eichleri, grevillea_rara, pityrodia_axillaris, prasophyllum_affine, pultenaea_setulosa, styphelia_capillaris, taraxacum_cygnorum, viola_improcera, canarium_acutifolium_var_acutifolium, astrotricha_sp_wingan_inlet, babingtonia_tozerensis, capparis_thozetiana, carronia_pedicellata, chamaesyce_carissoides, colobanthus_curtisiae, conospermum_hookeri, corchorus_cunninghamii, corokia_whiteana, corymbia_leptoloma, corymbia_rhodops, corymbia_xanthope, corynocarpus_rupestris_subsp_rupestris, cryptocarya_foetida, denhamia_parvifolia, danhatchia_copelandii, eucalyptus_boliviana, rhodamnia_sessiliflora, rhodamnia_whiteana, eleocharis_obicis, endiandra_hayesii, eucalyptus_aggregata, eucalyptus_alligatrix_miscella, eucalyptus_argutifolia, eucalyptus_beardiana, eucalyptus_crispata, eucalyptus_hallii, eucalyptus_langleyi, eucalyptus_parramattensis_decadens, eucalyptus_pulverulenta, eucalyptus_raveretiana, eucalyptus_rhodantha, eucalyptus_steedmanii, eucalyptus_strzeleckii, euphrasia_crassiuscula_glandulifera, floydia_praealta, fontainea_australis, gastrolobium_lehmannii, grevillea_banyabba, grevillea_elongata, grevillea_kennedyana, hakea_archaeoides, helichrysum_calvertianum]
    bark_transition_height:
      label: Bark transition height
      description: >
        For trees (particularly eucalypts) with rough, persistent bark on
        the lower trunk and smooth, shedding bark above - a common
        "half-bark" pattern - the height above ground at which the bark
        changes from rough to smooth. Provisional name; the maintainer may
        rename this once formally reviewed. Only score when a source gives
        an explicit height for the transition, not merely a rough/smooth
        two-zone description with no height stated (see bark_texture /
        bark_morphology_eucalyptus with context="trunk"/"branches" for that
        weaker case).
      type: numeric
      units: m
      allowed_values_min: 0.1
      allowed_values_max: 30.0
      status: maintainer-specified 2026-09-03 (name provisional - "I might come up with a better term later, but that will do for now")
      used_in: []
    bark_texture:
      label: Bark texture
      description: >
        The surface texture of bark on a stem or trunk - the non-Eucalyptus-
        restricted counterpart to the real APD trait bark_morphology_eucalyptus,
        which uses genus-specific named bark types (stringybark, box, gum,
        ribbonbark, etc.) rather than a general texture vocabulary. Use
        bark_morphology_eucalyptus where a named eucalypt type applies; use
        this trait for other taxa, or for texture detail (e.g. corky,
        curling) a source gives that isn't captured by the eucalypt type terms.
      type: categorical
      allowed_values_levels:
        smooth: Bark with an unbroken, even surface.
        flaky: Bark that peels off in small flakes or scales.
        fibrous: Bark composed of long, interwoven fibres.
        furrowed: Bark with long, deep longitudinal grooves.
        fissured: Bark cracked into a network of narrow fissures.
        corky: Bark with a soft, spongy, cork-like texture.
        curling: Bark that peels away in tight curls or coils (e.g. "minniritchi" bark).
        scaly: Bark that breaks into small, plate-like scales.
        rough: Bark with an uneven, coarse surface not otherwise specified.
        papery: Bark that peels away in thin, papery sheets.
      status: accepted 2026-08-25
      used_in: [acacia_ammophila, acacia_curranii, microcorys_eremophiloides, syzygium_hodgkinsoniae, eucalyptus_stenostoma, eucalyptus_crucis_crucis, babingtonia_tozerensis, cassinia_heleniae, cassinia_tegulata, corymbia_leptoloma, corymbia_rhodops, corymbia_xanthope, cycas_silvestris, eucalyptus_boliviana, leptospermum_crassifolium, pittosporum_kororoense, rhodamnia_sessiliflora, rhodamnia_whiteana, eucalyptus_sturgissiana, leptospermum_thompsonii, eucalyptus_paliformis, nematolepis_rhytidophylla, eucalyptus_scopulorum, kardomia_silvestris, prostanthera_tallowa, brachychiton_guymeri, endiandra_hayesii, eucalyptus_aggregata, eucalyptus_alligatrix_miscella, eucalyptus_argutifolia, eucalyptus_beardiana, eucalyptus_camfieldii, eucalyptus_crispata, eucalyptus_glaucina, eucalyptus_langleyi, eucalyptus_nicholii, eucalyptus_parramattensis_decadens, eucalyptus_pulverulenta, eucalyptus_raveretiana, eucalyptus_rhodantha, eucalyptus_robertsonii_hemisphaerica, eucalyptus_steedmanii, eucalyptus_strzeleckii, floydia_praealta, hakea_archaeoides, hakea_fraseri]
    bark_colour:
      label: Bark colour
      description: >
        The colour of bark on a stem or trunk - the sibling colour trait to
        bark_texture, using the same soil_colour-style earthy palette. Note:
        this trait was documented as accepted in trait_notes.md from
        2026-08-25 onward, but the entry itself was never actually added to
        this file until 2026-09-02, when the gap was found and fixed during
        a Pittosporum kororoense extraction - restoring consistency between
        the two files.
      type: categorical
      allowed_values_levels:
        black: Bark is black.
        brown: Bark is brown.
        brown_dark: Bark is dark brown.
        brown_light: Bark is light brown.
        green: Bark is green.
        grey: Bark is grey.
        orange: Bark is orange.
        pink: Bark is pink.
        red: Bark is red.
        white: Bark is white.
        yellow: Bark is yellow.
      status: accepted 2026-08-25 (file entry restored 2026-09-02)
      used_in: [pittosporum_kororoense, rhodamnia_sessiliflora, rhodamnia_whiteana, eucalyptus_sturgissiana, eucalyptus_paliformis, nematolepis_rhytidophylla, eucalyptus_scopulorum, kardomia_silvestris, prostanthera_tallowa, brachychiton_guymeri, endiandra_hayesii, eucalyptus_aggregata, eucalyptus_alligatrix_miscella, eucalyptus_argutifolia, eucalyptus_beardiana, eucalyptus_camfieldii, eucalyptus_crispata, eucalyptus_glaucina, eucalyptus_hallii, eucalyptus_langleyi, eucalyptus_nicholii, eucalyptus_parramattensis_decadens, eucalyptus_pulverulenta, eucalyptus_raveretiana, eucalyptus_rhodantha, eucalyptus_robertsonii_hemisphaerica, eucalyptus_steedmanii, eucalyptus_strzeleckii, floydia_praealta, grevillea_glossadenia, hakea_archaeoides, hakea_fraseri]
    stipule_presence:
      label: Stipule presence
      description: >
        Whether a leaf bears stipules (small appendages, often paired, at the
        base of the petiole) and, where the source states it, their general
        form. Note: stipules modified specifically into sharp defensive
        spines should also be scored under the real APD trait
        plant_physical_defence_structures (value: spine).
      type: categorical
      allowed_values_levels:
        present: Stipules are present (form otherwise unspecified).
        absent: Stipules are absent.
        spine: Stipules modified into spines.
        scale: Small, scale-like stipules.
        leafy: Stipules that are leaf-like in size and texture.
      status: accepted 2026-08-25
      used_in: [acacia_awestoniana, acacia_aristulata, acacia_lobulata, chorizema_varium, rhodamnia_sessiliflora, rhodamnia_whiteana, androcalva_inglewoodensis, androcalva_beeronensis, brachychiton_guymeri]
    stipule_length:
      label: Stipule length
      description: >
        The length of a stipule, where present (see stipule_presence).
      type: numeric
      units: mm
      allowed_values_min: 0.1
      allowed_values_max: 200.0
      status: accepted 2026-08-25
      used_in: [acacia_aristulata, pomaderris_cotoneaster, pultenaea_setulosa, chorizema_varium, androcalva_inglewoodensis, androcalva_beeronensis, brachychiton_guymeri]
    senescence_onset:
      label: Age at senescence onset
      description: >
        The age of a plant when whole-plant or crown senescence (dieback)
        begins - distinct from lifespan (total duration, germination to
        death) and reproductive_maturity (age of first seed set). Name is
        provisional; may be renamed once formally reviewed.
      type: numeric
      units: a
      allowed_values_min: 0.1
      allowed_values_max: 1000.0
      status: tentatively accepted 2026-08-25 - name not yet finalised
      used_in: [daviesia_bursarioides]
    reproductive_maturity_to_senescence:
      label: Duration from reproductive maturity to senescence
      description: >
        The time interval (duration) from when a plant first reaches
        reproductive maturity to when senescence onset begins - a sibling
        measure to senescence_onset (an age) and distinct from lifespan
        (total duration, germination to death).
      type: numeric
      units: a
      allowed_values_min: 0.1
      allowed_values_max: 1000.0
      status: tentatively accepted 2026-08-25 - name not yet finalised
      used_in: [boronia_boliviensis]
    flower_petal_width:
      label: Flower petal width
      description: >
        The width of an individual flower petal - the width-axis sibling of
        the existing real APD trait flower_petal_length. Note: petal
        *length* already has a real, dedicated APD trait
        (flower_petal_length) and should always be scored there directly,
        never proposed as a new trait.
      type: numeric
      units: mm
      allowed_values_min: 1.0
      allowed_values_max: 100.0
      status: accepted 2026-08-25
      used_in: [boronia_boliviensis, daviesia_bursarioides, darwinia_carnea, dipodium_pictum, tetratheca_aphylla, conospermum_quadripetalum, danhatchia_copelandii, drosera_oreopodion, homoranthus_croftianus, persoonia_flexifolia, pittosporum_kororoense, rhodamnia_sessiliflora, rhodamnia_whiteana, zieria_odorifera_subsp_copelandii, pterostylis_metcalfei, boronia_grimshawii, gastrolobium_lehmannii, hibbertia_marginata]
    generation_time:
      label: Generation time
      description: >
        The average age of parents of the current cohort, reflecting the
        turnover rate of breeding individuals in a population - the standard
        IUCN Red List assessment parameter (IUCN 2019 Guidelines), used to
        set the time window for population-reduction (Criterion A) and
        extreme-fluctuation assessments. Distinct from lifespan (germination
        to death) and reproductive_maturity (age of first seed set):
        generation time is a population-turnover statistic, often
        approximated in listing assessments as roughly midway between age at
        first reproduction and maximum lifespan, or simply inferred from
        congeneric species when direct data are unavailable. Recurring gap
        identified 2026-09-01/02: a standard, frequently-reported metric in
        formal IUCN-criteria listing assessments (reported with point/min/max
        structure, same as extent_of_occurrence and area_of_occupancy),
        appearing in 15+ species profiles across this project with nowhere
        to be recorded.
      type: numeric
      units: a
      allowed_values_min: 1.0
      allowed_values_max: 500.0
      status: accepted 2026-09-02
      used_in: [acacia_baueri_subsp_aspera, acacia_blayana, acacia_constablei, acacia_courtii, acacia_lanigera_var_gracilipes, almaleea_cambagei, asterolasia_buxifolia, boronia_boliviensis, viola_improcera, bertya_mollissima, bertya_sp_clouds_creek, astrotricha_sp_wingan_inlet, chiloglottis_anaticeps, choretrum_spicatum_subsp_spicatum, corchorus_cunninghamii, corokia_whiteana, correa_lawrenceana_var_genoensis, conospermum_quadripetalum, dillwynia_rupestris, drosera_oreopodion, eucalyptus_boliviana, gentiana_baeuerlenii, gentiana_wissmannii, hibbertia_superans, homoranthus_croftianus, leptospermum_crassifolium, lordhowea_pilosicrista, olearia_suffruticosa, pittosporum_kororoense, prostanthera_rowleys_creek, pultenaea_insularis, rhodamnia_sessiliflora, rhodamnia_whiteana, typhonium_sp_cox_peninsula, cyphanthera_scabrella, eucalyptus_sturgissiana, leptospermum_thompsonii, pherosphaera_fitzgeraldii, deyeuxia_talariata, eucalyptus_paliformis, grevillea_rhizomatosa, nematolepis_rhytidophylla, pterostylis_metcalfei, eucalyptus_scopulorum, boronia_subulifolia, boronia_deanei_acutifolia, boronia_deanei_deanei, boronia_grimshawii, cassinia_theodorii, kunzea_juniperoides_pernervosa, prostanthera_tallowa, brachychiton_guymeri]
